name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  motion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: npm ci
      # Remotion downloads Chrome Headless Shell here on the first render; npm ci wipes it.
      - uses: actions/cache@v6
        with:
          path: motion/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('motion/package-lock.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run still
      - run: npm run still:preview
      - run: npm run still:timeline
      - run: npm run still:factquest
      - run: npm run still:bossbattle
      - run: npm run still:quizchest
      - run: npm run still:dialogstory
      - run: npm run still:pixelskit
