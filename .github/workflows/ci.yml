name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15"
      - run: ruff check .
      - run: bash -n install.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # The owner's main path in Chromium against a local Graph API stub (web/e2e/smoke.spec.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No ffmpeg: the seed copies a sample video and the publish path never probes it.
      - run: pip install -e ".[dev]"
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  motion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: npm ci
      # Remotion downloads Chrome Headless Shell here on the first render; npm ci wipes it.
      - uses: actions/cache@v6
        with:
          path: motion/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('motion/package-lock.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Python <-> template schemas (voice scripts): needs node_modules, so it runs here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: .
      - run: pytest -q tests/test_studio_motion.py -k "script or schema or validate_props"
        working-directory: .
      - run: npm run still
      - run: npm run still:preview
      - run: npm run still:timeline
      - run: npm run still:factquest
      - run: npm run still:bossbattle
      - run: npm run still:quizchest
      - run: npm run still:dialogstory
      - run: npm run still:pixelskit
