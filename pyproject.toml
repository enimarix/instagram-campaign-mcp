[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-campaign-mcp"
version = "2.0.0"
description = "MCP server for organic Instagram campaigns: publish, schedule, measure and find winning posts (official Graph API)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "José Luis Badano (original ig-mcp)" }, { name = "Amine El Kerzazi" }]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "structlog>=23.2",
    "asyncio-throttle>=1.0.2",
    "pillow>=10.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
ig-campaign-mcp = "src.instagram_mcp_server:main"
ig-campaign = "src.scheduler:main"

[tool.setuptools.packages.find]
include = ["src*"]
