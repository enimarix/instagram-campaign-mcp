[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-campaign-mcp"
version = "2.0.0"
description = "MCP server for organic Instagram campaigns: publish, schedule, measure and find winning posts (official Graph API)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "José Luis Badano (original ig-mcp)" }, { name = "Amine El Kerzazi" }]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "structlog>=23.2",
    "pillow>=10.0",
    "jsonschema>=4.18",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.15"]
# Local transcription (src/studio/stt.py). Not in dev: CI never downloads models.
stt = ["faster-whisper==1.2.1"]
# Fallback Reel downloader (src/studio/downloader.py). yt-dlp 2026.10.26 needs Python 3.11+.
download = ["yt-dlp==2026.10.26; python_version >= '3.11'"]

[project.scripts]
ig-campaign-mcp = "src.instagram_mcp_server:main"
ig-campaign = "src.scheduler:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".team-up", "web", "motion", "vendor"]

[tool.ruff.lint]
# ponytail: safe baseline only; B (22 x B904) and UP rules are a follow-up PR
select = ["E4", "E7", "E9", "F", "I"]
